<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body><title>INOSUKE EDITING PORTFOLIO</title><meta name="claude:viewport-fit-sides" content="cover"><style id="pg">
/* Layout: centered profile hero, then a responsive grid of video cards. Only the owner, viewing inside Claude, gets an edit panel and a floating Save bar. */
:root{--bg:#faf8f5;--card:#ffffff;--tx:#1d1b1a;--mute:#6b6560;--ac:#e4572e;--bd:#e7e2dc;--warn:#b3261e}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141312;--card:#1f1d1c;--tx:#f3efea;--mute:#a39c95;--ac:#ff7a50;--bd:#33302d;--warn:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141312;--card:#1f1d1c;--tx:#f3efea;--mute:#a39c95;--ac:#ff7a50;--bd:#33302d;--warn:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font-family:"Noto Sans Devanagari",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:960px;margin:0 auto;padding-block:28px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.avatar{width:140px;height:140px;border-radius:50%;object-fit:cover;border:4px solid var(--ac);background:var(--card);display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--ac)}
h1{margin:6px 0 0;font-size:2rem;line-height:1.15;text-wrap:balance;overflow-wrap:anywhere}
.tag{color:var(--mute);margin:0}
.about{max-width:60ch;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:10px}
.pill{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--card);border:1px solid var(--bd);color:var(--tx);text-decoration:none;font-weight:600;font-size:.95rem;max-width:100%;overflow-wrap:anywhere}
.pill:hover{border-color:var(--ac);color:var(--ac)}
h2{margin:40px 0 16px;font-size:1.3rem;text-wrap:balance}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:16px}
.vid{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;min-width:0}
.vid video{width:100%;display:block;background:#000;aspect-ratio:16/9}
.linkbox{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;aspect-ratio:16/9;background:var(--bg);color:var(--tx);text-decoration:none;font-weight:600;padding:12px;text-align:center}
.linkbox .play{font-size:2rem;color:var(--ac)}
.linkbox small{color:var(--mute);font-weight:400;overflow-wrap:anywhere}
.vid .t{padding:10px 12px;font-weight:600;display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.vid .t span.n{min-width:0;overflow-wrap:anywhere}
.vid .t input{flex:1 1 140px;min-width:0}
.empty{color:var(--mute);text-align:center;padding:30px;border:1px dashed var(--bd);border-radius:14px}
button,.btn{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff;font-weight:600}
button:disabled{opacity:.55;cursor:default}
button.g,.btn.g{background:var(--card);color:var(--tx);border:1px solid var(--bd)}
button.warn{background:var(--warn);color:#fff;border:0}
button.sm{padding:5px 9px;font-size:.8rem}
button:focus-visible,.btn:focus-within,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:24px;display:grid;gap:12px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:10px}
.panel label{font-size:.85rem;color:var(--mute);display:grid;gap:4px;min-width:0}
.panel input,.panel textarea,.vid input{font:inherit;padding:9px 11px;border-radius:9px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);width:100%}
.panel textarea{min-height:84px;resize:vertical}
.panel input[type=color]{padding:2px;height:40px;width:70px;cursor:pointer}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
:root{--g1:#e50914;--g2:#ff4d4d}
html:root:root:root{--bg:#0b0b0b;--card:#181818;--tx:#ffffff;--mute:#b3b3b3;--ac:#e50914;--bd:#2d2d2d;color-scheme:dark}
h1{text-transform:uppercase;font-weight:900;letter-spacing:.06em}
body{background-image:radial-gradient(ellipse 70% 38% at 50% 0,rgba(229,9,20,.28),transparent 70%),linear-gradient(180deg,transparent 60%,rgba(229,9,20,.08));background-repeat:no-repeat}
.hero{animation:rise .7s ease both}
.avatar{border:0;padding:4px;background:linear-gradient(135deg,var(--g1),var(--g2));box-shadow:0 0 0 4px rgba(229,9,20,.18),0 10px 40px rgba(229,9,20,.5);animation:glow 3s ease-in-out infinite}
h1{background:linear-gradient(90deg,var(--g1),var(--g2));-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.02em}
.tag{font-weight:600;letter-spacing:.12em;text-transform:uppercase;font-size:.85rem}
.pill{transition:transform .2s,box-shadow .2s,border-color .2s}
.pill:hover{transform:translateY(-3px);border-color:var(--g1);color:var(--g1);box-shadow:0 8px 22px rgba(229,9,20,.4)}
.dm{animation:pulse 2.4s ease-in-out infinite}
h2{display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--g1),transparent)}
.vid{transition:transform .25s,box-shadow .25s,border-color .25s}
.vid:hover{transform:translateY(-5px);border-color:var(--g1);box-shadow:0 12px 30px rgba(229,9,20,.4)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes glow{50%{box-shadow:0 0 0 8px rgba(229,9,20,.12),0 12px 54px rgba(255,77,77,.65)}}
@keyframes pulse{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.hero,.avatar,.dm{animation:none}.pill,.vid{transition:none}}
.grow{flex:1 1 200px;min-width:0}
#bar{position:fixed;right:calc(14px + env(safe-area-inset-right,0px));bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:5}
#bar button{box-shadow:0 4px 14px rgba(0,0,0,.25)}
#msg{color:var(--mute);font-size:.85rem}
label.btn{display:inline-block;position:relative;overflow:hidden}
label.btn input{position:absolute;left:0;top:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0;padding:0;border:0}

ent": "#000000", "videos": []}</script><script id="code">
(function () {
var TITLE = 'INOSUKE EDITING PORTFOLIO';
var S = JSON.parse(document.getElementById('data').textContent);
var defaults = { name: TITLE, tagline: '', about: '', photo: '', instagram: '', whatsapp: '', email: '', heading: '🎬 Videos I have edited', accent: '', videos: [] };
Object.keys(defaults).forEach(function (k) { if (S[k] == null) S[k] = defaults[k]; });
var snap = JSON.stringify(S);
var editing = false, art = null, assets = null, canEdit = false, saving = false, pendingDel = null;
var app = document.getElementById('app'), bar = document.getElementById('bar');

function el(t, c, x) { var e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; }
function clean(v) { return (v || '').trim(); }
function setMsg(t) { var m = document.getElementById('msg'); if (m) m.textContent = t; }
function applyAccent() { var r = document.documentElement.style; if (S.accent) r.setProperty('--ac', S.accent); else r.removeProperty('--ac'); }

function links() {
  var box = el('div', 'links');
  var ig = clean(S.instagram).replace(/^@/, '').replace(/^https?:\/\/(www\.)?instagram\.com\//, '').replace(/\/$/, '');
  var wa = clean(S.whatsapp).replace(/[^\d]/g, '');
  var em = clean(S.email);
  function add(text, href, blank) { var a = el('a', 'pill', text); a.href = href; if (blank) { a.target = '_blank'; a.rel = 'noopener'; } box.append(a); }
  if (ig) add('📸 @' + ig, 'https://instagram.com/' + ig, true);
  if (wa) add('💬 WhatsApp', 'https://wa.me/' + wa, true);
  if (em) add('✉️ ' + em, 'mailto:' + em, false);
  return box;
}
function refreshHero() {
  var o = document.getElementById('lk'); if (o) { var n = links(); n.id = 'lk'; o.replaceWith(n); }
  var h = document.getElementById('hn'); if (h) h.textContent = S.name;
  var t = document.getElementById('ht'); if (t) { t.textContent = S.tagline; t.hidden = !S.tagline; }
  var a = document.getElementById('ha'); if (a) { a.textContent = S.about; a.hidden = !S.about; }
  var s = document.getElementById('hs'); if (s) s.textContent = S.heading;
}
function field(label, key, ph, multi) {
  var l = el('label', null, label), i = el(multi ? 'textarea' : 'input');
  i.id = 'f_' + key; i.value = S[key] || ''; i.placeholder = ph || '';
  i.oninput = function () { S[key] = i.value; refreshHero(); };
  l.append(i); return l;
}
function fileBtn(text, accept, cb, cls) {
  var l = el('label', 'btn ' + (cls || ''), text), i = el('input'); i.type = 'file'; i.accept = accept;
  i.onchange = function () { var f = i.files[0]; i.value = ''; if (f) cb(f); };
  l.append(i); return l;
}
async function upload(file) {
  if (file.size > 20 * 1024 * 1024) { setMsg('This file is over 20 MB. Compress it, or use "Add video link" instead.'); return null; }
  setMsg('Uploading… please wait');
  try { var r = await assets.upload(file); setMsg(''); return r; }
  catch (e) { setMsg('Upload failed (files must be under 20 MB): ' + (e.message || e.code || '')); return null; }
}
function move(i, d) { var j = i + d; if (j < 0 || j >= S.videos.length) return; var t = S.videos[i]; S.videos[i] = S.videos[j]; S.videos[j] = t; render(); }

function videoCard(v, i) {
  var c = el('div', 'vid'), m;
  if (v.kind === 'link') {
    m = el('a', 'linkbox'); m.href = v.url; m.target = '_blank'; m.rel = 'noopener';
    var host = ''; try { host = new URL(v.url).hostname; } catch (e) {}
    m.append(el('span', 'play', '▶'), el('span', null, 'Open video'), el('small', null, host));
  } else {
    m = el('video'); m.src = v.url; m.controls = true; m.preload = 'metadata'; m.playsInline = true;
  }
  var t = el('div', 't');
  if (editing) {
    var ti = el('input'); ti.id = 'vt_' + i; ti.value = v.title || ''; ti.placeholder = 'Video title';
    ti.oninput = function () { v.title = ti.value; };
    var w = el('span', 'row');
    var up = el('button', 'g sm', '↑'); up.onclick = function () { move(i, -1); }; up.disabled = i === 0;
    var dn = el('button', 'g sm', '↓'); dn.onclick = function () { move(i, 1); }; dn.disabled = i === S.videos.length - 1;
    var dl = el('button', pendingDel === v ? 'warn sm' : 'g sm', pendingDel === v ? 'Tap again to delete' : '🗑️');
    dl.onclick = function () { if (pendingDel === v) { S.videos.splice(i, 1); pendingDel = null; } else pendingDel = v; render(); };
    w.append(up, dn, dl); t.append(ti, w);
  } else {
    t.append(el('span', 'n', v.title || 'Video'));
  }
  c.append(m, t); return c;
}

function render() {
  app.replaceChildren();
  if (editing) {
    var p = el('div', 'panel');
    p.append(el('b', null, '✏️ Edit mode. Change anything, then press Save.'));
    var f = el('div', 'fields');
    f.append(field('Name', 'name', 'Your name'), field('Short tagline', 'tagline', 'e.g. Video Editor'),
      field('Instagram ID', 'instagram', 'username (without @)'), field('WhatsApp number (with country code)', 'whatsapp', '919876543210'),
      field('Email', 'email', 'name@example.com'), field('Videos section heading', 'heading', 'Videos I have edited'));
    p.append(f, field('About me (optional)', 'about', 'Write a few lines about yourself', true));
    var cr = el('div', 'row'), cl = el('label', null, 'Accent color'), ci = el('input'); ci.type = 'color'; ci.id = 'f_accent';
    ci.value = S.accent || '#e4572e'; ci.oninput = function () { S.accent = ci.value; applyAccent(); };
    cl.append(ci);
    var cres = el('button', 'g sm', 'Reset color'); cres.onclick = function () { S.accent = ''; applyAccent(); render(); };
    cr.append(cl, cres); p.append(cr);
    var r = el('div', 'row');
    if (assets) {
      r.append(fileBtn('🖼️ Change profile photo', 'image/*', async function (file) { var u = await upload(file); if (u) { S.photo = u.url; render(); } }, 'g'));
      if (S.photo) { var rp = el('button', 'g', 'Remove photo'); rp.onclick = function () { S.photo = ''; render(); }; r.append(rp); }
      r.append(fileBtn('🎬 Upload video', 'video/*', async function (file) { var u = await upload(file); if (u) { S.videos.push({ url: u.url, title: file.name.replace(/\.[^.]+$/, '') }); render(); } }, ''));
    }
    p.append(r);
    var lr = el('div', 'row'), li = el('input', 'grow'); li.id = 'lnk'; li.placeholder = 'Paste a YouTube / Instagram / Drive video link';
    var lb = el('button', 'g', '🔗 Add video link');
    lb.onclick = function () {
      var u = clean(li.value);
      if (!/^https?:\/\//i.test(u)) { setMsg('Link must start with http:// or https://'); return; }
      S.videos.push({ kind: 'link', url: u, title: 'Video link' }); render();
    };
    lr.append(li, lb); p.append(lr);
    var msg = el('div', null, assets ? 'Uploads can be up to 20 MB each. For bigger videos, upload to YouTube or Drive and add the link above.' : 'Direct uploads are not available right now. Add video links instead.');
    msg.id = 'msg'; p.append(msg);
    app.append(p);
  }
  var hero = el('div', 'hero');
  if (S.photo) { var im = el('img', 'avatar'); im.src = S.photo; im.alt = S.name; hero.append(im); }
  else hero.append(el('div', 'avatar', '👤'));
  var h1 = el('h1', null, S.name); h1.id = 'hn';
  var tg = el('p', 'tag', S.tagline); tg.id = 'ht'; tg.hidden = !S.tagline;
  var ab = el('p', 'about', S.about); ab.id = 'ha'; ab.hidden = !S.about;
  var lk = links(); lk.id = 'lk';
  var dm = el('p', 'dm', '💬 DM me on Instagram for editing work'); dm.style.cssText = 'margin:2px 0 0;font-size:.95rem;opacity:.85;font-weight:600';
  hero.append(h1, tg, ab, lk, dm); app.append(hero);
  var h2 = el('h2', null, S.heading); h2.id = 'hs'; app.append(h2);
  if (!S.videos.length) app.append(el('div', 'empty', editing ? 'Upload a video or add a link above to get started.' : 'Videos coming soon.'));
  var g = el('div', 'grid');
  S.videos.forEach(function (v, i) { g.append(videoCard(v, i)); });
  app.append(g);
  bar.replaceChildren();
  if (canEdit) {
    if (!editing) { var b = el('button', null, '✏️ Edit'); b.onclick = function () { editing = true; render(); }; bar.append(b); }
    else {
      var s = el('button', null, saving ? 'Saving…' : '💾 Save'); s.disabled = saving; s.onclick = save;
      var c = el('button', 'g', 'Cancel'); c.disabled = saving;
      c.onclick = function () { S = JSON.parse(snap); pendingDel = null; editing = false; applyAccent(); render(); };
      bar.append(c, s);
    }
  }
}

function buildDoc() {
  var rs = document.head.querySelector('style');
  var reset = rs ? rs.textContent : '';
  var head = '<title>' + TITLE + '</title><meta name="claude:viewport-fit-sides" content="cover"><style id="pg">' + document.getElementById('pg').textContent + '</style>';
  var json = JSON.stringify(S).replace(/</g, '\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>' + reset + '</style></head><body>' +
    head + '<div class="wrap" id="app"></div><div id="bar"></div>' +
    '<script id="data" type="application/json">' + json + '<\/script>' +
    '<script id="code">' + document.getElementById('code').textContent + '<\/script></body></html>';
}
async function save() {
  if (saving || !art) return;
  S.name = clean(S.name) || TITLE;
  saving = true; render(); setMsg('Saving…');
  try { await art.publish(buildDoc()); }
  catch (e) { saving = false; render(); setMsg(e && e.code === 'conflict' ? 'A newer version exists. The page will reload with it.' : 'Could not save: ' + ((e && (e.message || e.code)) || 'unknown error')); }
}

applyAccent(); render();
(async function () {
  try {
    var c = window.claude; if (!c || !c.use) return;
